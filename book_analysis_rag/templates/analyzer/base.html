<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Article Summarizer{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <header style="padding: 1rem; background: #f5f5f5; margin-bottom: 2rem;">
    <nav>
      <a href="{% url 'home' %}" style="margin-right: 1rem; font-weight: bold;">
        Article Summarizer
      </a>
      <a href="{% url 'upload_article' %}" style="margin-right: 1rem;">Send an article</a>
      <a href="{% url 'article_list' %}">View all saved articles</a>
    </nav>
  </header>

  <main style="max-width: 800px; margin: auto; padding: 0 1rem;">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}
    <!-- Conteúdo de cada página será inserido aqui -->
    {% endblock %}
  </main>

  <footer style="padding: 1rem; text-align: center; margin-top: 2rem; background: #f5f5f5;">
    <small>&copy; {{ now.year }} Article Summarizer</small>
  </footer>

</body>
</html>
